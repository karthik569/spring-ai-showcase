server:
  port: 8080

spring:
  http:
    client:
      # Without these, a wedged Ollama process holds a request thread open for the container default, and a
      # browser tab streaming tokens can sit on a half-dead connection indefinitely.
      connect-timeout: 5s
      read-timeout: ${LLM_READ_TIMEOUT:90s}
  application:
    name: spring-ai-showcase
  datasource:
    # Conversations outlive the process; drop to jdbc:h2:mem: for a throwaway store.
    url: ${CHAT_MEMORY_JDBC_URL:jdbc:h2:file:./data/chat-memory}
    username: ${CHAT_MEMORY_JDBC_USERNAME:sa}
    password: ${CHAT_MEMORY_JDBC_PASSWORD:}
    driver-class-name: org.h2.Driver
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # The shipped H2 script has no IF NOT EXISTS; the initializer runs it with continue-on-error,
            # so a second boot against the same file keeps its rows instead of failing on a duplicate table.
            initialize-schema: always
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
    openai:
      api-key: ${OPENAI_API_KEY:demo-api-key}
      base-url: ${OPENAI_BASE_URL:http://localhost:8081}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen2.5}
          temperature: 0.7
      embedding:
        options:
          # Needs a real embedding model (all-minilm, nomic-embed-text, text-embedding-3-small). A chat
          # model used as the vectorizer produces near-random cosine scores, so short queries match nothing.
          # The vectorizer itself is built in AiConfig against app.embedding.base-url below; this value is
          # what that bean is named, and what the auto-configured client would have used.
          model: ${OPENAI_EMBEDDING_MODEL:all-minilm}

springdoc:
  swagger-ui:
    # Not the default /swagger-ui.html and not /: a UI mounted at the root would collide with the demo
    # page, which is served as the static welcome page from src/main/resources/static/index.html.
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  directory: logs
  level:
    ENDPOINT_ACCESS: INFO
    # Spring AI's retry interceptor prints a full stack for every failed attempt; GlobalExceptionHandler
    # already reports the root cause once per request, with the requestId to correlate it. The package
    # was renamed from org.springframework.ai.autoconfigure.retry when the autoconfigure module merged.
    org.springframework.ai.retry.autoconfigure: ERROR

app:
  ai:
    # Ceiling on simultaneous model calls; extra requests get an immediate 503 rather than queueing unseen.
    max-concurrent-requests: 4
  embedding:
    # llama-server serves one model per process, so the vectorizer runs on its own port instead of
    # sharing chat's. Started by start-offline-llm.sh (second llama-server on 8082).
    base-url: ${OPENAI_EMBEDDING_BASE_URL:http://localhost:8082}
    model: ${OPENAI_EMBEDDING_MODEL:all-minilm}
  guardrails:
    # Redact PII from model output before it leaves the API. Turn off to see raw completions while debugging.
    redact-output: ${GUARDRAILS_REDACT_OUTPUT:true}
    # Reject document uploads that look like prompt injection instead of indexing them.
    block-injection-on-ingest: ${GUARDRAILS_BLOCK_INJECTION:true}
  health:
    llm:
      cache-ttl: 30s
  rag:
    # Read by RagController: threshold applies to the grounded /query path only.
    # all-minilm cosine for a relevant short question against these chunks lands around 0.3-0.45, so a
    # cutoff above ~0.4 silently drops the context and the model answers from memory.
    similarity-threshold: 0.2
    top-k: 4
    follow-up:
      # Rewrites "and what about travel?" into a standalone question before the retrieval advisor sees it, and
      # stores RAG turns in the same chat memory so the next follow-up has an antecedent. Costs one extra model
      # call: 325-595 ms on a turn whose baseline /rag/query was 1.1-2.1 s, so budget roughly +20-60 % on the
      # turns that get resolved and nothing on the ones skipped for want of a conversation.
      enabled: ${RAG_FOLLOW_UP_ENABLED:true}
      max-history-turns: 2
      max-query-chars: 300
      # Only rewrite questions holding a demonstrative or starting with a conjunction. Default false: a missed
      # rewrite is invisible, a slow one is not, and this trigger is a closed-class guess over a 494M model.
      require-trigger: ${RAG_FOLLOW_UP_REQUIRE_TRIGGER:false}
    store:
      # SimpleVectorStore is in memory; this writes it to two files on startup and reads them back, which is
      # what makes POST /rag/documents survive a restart. Turn it off for a throwaway knowledge base.
      enabled: ${RAG_STORE_ENABLED:true}
      directory: ${RAG_STORE_DIRECTORY:./data/rag}
      # Write on every index change. Set false to write only on shutdown if the store is edited often.
      save-on-write: ${RAG_STORE_SAVE_ON_WRITE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # The llm indicator's model name and probe latency are the reason it exists.
      show-details: always
