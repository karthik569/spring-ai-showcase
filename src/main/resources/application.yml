server:
  port: 8080

spring:
  application:
    name: spring-ai-showcase
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
    openai:
      api-key: ${OPENAI_API_KEY:demo-api-key}
      base-url: ${OPENAI_BASE_URL:http://localhost:8081}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen2.5}
          temperature: 0.7
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:qwen2.5}

app:
  rag:
    similarity-threshold: 0.65
    top-k: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
